---
layout: default
---

<article class="post-card">
  <p class="post-meta">
    <span>{{ page.date | date: "%b %-d, %Y" }}</span>
    {% if page.tags %}
      <span class="dot">•</span>
      {% for tag in page.tags %}
        <span class="tag">{{ tag }}</span>
      {% endfor %}
    {% endif %}
  </p>

  <h2>{{ page.title }}</h2>
  <div class="post-content">
    {{ content }}
  </div>
</article>

<p class="back-link"><a href="{{ '/blog/' | relative_url }}">← Back to blog</a></p>
